<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" fill="none">
<defs>
  <linearGradient id="helmet" x1="130" y1="80" x2="390" y2="170" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFE37A"/><stop offset=".45" stop-color="#FFC43D"/><stop offset="1" stop-color="#D9820C"/>
  </linearGradient>
  <linearGradient id="shell" x1="115" y1="170" x2="390" y2="380" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/><stop offset=".45" stop-color="#DCE5F0"/><stop offset="1" stop-color="#7B8BA0"/>
  </linearGradient>
  <linearGradient id="body" x1="130" y1="360" x2="390" y2="590" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F3F7FB"/><stop offset=".45" stop-color="#BFCBD9"/><stop offset="1" stop-color="#68788D"/>
  </linearGradient>
  <linearGradient id="suit" x1="180" y1="390" x2="350" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#263A54"/><stop offset="1" stop-color="#101C2D"/>
  </linearGradient>
  <radialGradient id="visor" cx="50%" cy="18%" r="80%">
    <stop stop-color="#19385D"/><stop offset=".48" stop-color="#071426"/><stop offset="1" stop-color="#020811"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<ellipse cx="270" cy="590" rx="190" ry="38" fill="#48AFFF" opacity=".14" filter="url(#glow)"/>
<g filter="url(#shadow)">
  <!-- back helmet -->
  <path d="M146 173C146 91 204 48 271 48c73 0 128 48 128 126v28H146v-29Z" fill="url(#helmet)"/>
  <path d="M139 174c35-18 249-18 270 0v29c-18 23-247 23-270 0v-29Z" fill="#E99B20"/>
  <path d="M257 48h27v45h-27z" rx="12" fill="#F8B735"/>
  <path d="M267 62c-11 9-17 20-17 34" stroke="#FFF0A4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  <!-- house mark -->
  <path d="M278 101 306 80l28 21v30h-56v-30Z" fill="#26384E"/>
  <path d="M291 116h12v15h-12zM306 108h12v23h-12z" fill="#FFC43D"/>

  <!-- head shell -->
  <rect x="82" y="151" width="376" height="272" rx="104" fill="url(#shell)"/>
  <rect x="104" y="177" width="332" height="218" rx="82" fill="url(#visor)"/>
  <path d="M125 202c62-46 198-51 283 1" stroke="#5F8EBF" stroke-opacity=".38" stroke-width="9" stroke-linecap="round"/>
  <path d="M116 337c55 41 229 55 309-3" stroke="#000" stroke-opacity=".18" stroke-width="18" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M164 282c4-30 50-30 54 0" stroke="#91E1FF" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M322 282c4-30 50-30 54 0" stroke="#91E1FF" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M244 323c19 19 43 19 62 0" stroke="#7DD8FF" stroke-width="9" stroke-linecap="round"/>
  <!-- side ear -->
  <circle cx="89" cy="275" r="37" fill="#8C9DB1"/>
  <circle cx="89" cy="275" r="21" fill="#182B43"/>
  <circle cx="89" cy="275" r="8" fill="#6ED4FF" filter="url(#glow)"/>
  <circle cx="451" cy="275" r="37" fill="#8C9DB1"/>
  <circle cx="451" cy="275" r="21" fill="#182B43"/>

  <!-- neck -->
  <rect x="210" y="397" width="121" height="58" rx="26" fill="#18283D"/>

  <!-- body / jacket -->
  <path d="M155 428c32-24 196-24 230 0 42 30 68 110 72 173H86c5-64 29-143 69-173Z" fill="url(#suit)"/>
  <path d="M174 438c40-16 157-16 192 0l20 158H150l24-158Z" fill="url(#body)" opacity=".72"/>
  <path d="M206 443h113v116H206z" fill="#25384F" opacity=".95"/>
  <rect x="239" y="468" width="70" height="70" rx="17" fill="#F4F7FA"/>
  <rect x="249" y="478" width="50" height="50" rx="12" fill="#FFC043"/>
  <text x="274" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="900" fill="#26384E">CB</text>

  <!-- right arm -->
  <path d="M387 455c62 13 78 72 67 118-7 28-32 40-57 27-26-13-29-39-17-67l-30-40 37-38Z" fill="url(#body)"/>

  <!-- left arm and thumb up -->
  <path d="M157 448c-59 12-94 61-78 108 11 32 44 47 74 31 26-14 31-42 18-69l41-39-55-31Z" fill="url(#body)"/>
  <path d="M80 470c-18-22-18-50-1-72 12-15 35-13 46 2 8 12 7 28 1 42l18 17-26 31-38-20Z" fill="#1A2B40"/>
  <path d="M85 405c-5-30 10-57 31-61 20-4 31 15 25 35l-10 36-46-10Z" fill="#202F43"/>
  <path d="M84 402c-4-17 3-38 18-48 11-8 25-2 28 10 3 10-2 19-8 26l-8 12-30 0Z" fill="#2A3A50"/>
  <path d="M69 468c-10 22-7 47 14 60 17 11 38 5 49-10" stroke="#F5F8FC" stroke-width="8" stroke-linecap="round" opacity=".7"/>

  <!-- boots -->
  <path d="M151 570h101v54H134c-21 0-32-18-24-36 7-13 22-18 41-18Z" fill="#1A2B40"/>
  <path d="M286 570h101c19 0 34 6 41 20 9 18-3 34-24 34H286v-54Z" fill="#1A2B40"/>
</g>
</svg>