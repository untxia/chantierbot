	</defs>
	<!-- Trois barres ascendantes : construction (silhouette d'immeubles) + progression -->
	<rect x="8" y="34" width="10" height="22" rx="4" fill="url(#cb-gradient)" />
	<rect x="25" y="24" width="10" height="32" rx="4" fill="url(#cb-gradient)" />
	<rect x="42" y="14" width="10" height="42" rx="4" fill="url(#cb-gradient)" />
	<!-- Nœud IA / signal en pointe de la barre la plus haute -->
