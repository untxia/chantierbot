<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ChantierBot analyse vos photos de chantier par IA et aide les artisans à suivre l'avancement, les matériaux et les stocks." />
    <meta name="theme-color" content="#0B1020" />
    <meta property="og:title" content="ChantierBot" />
    <meta property="og:description" content="Agent IA pour artisans : analyse photo de chantier, suivi de stocks, prédiction des besoins." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChantierBot" />
    <title>ChantierBot</title>
    <script>
      if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      (function () {
        var saved = localStorage.getItem('chantierbot-theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
